{% if page.has_other_pages %}
<nav aria-label="Pagination" class="mt-3">
    <ul class="pagination mb-0">
        {% if page.has_previous %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">Précédent</a></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Page {{ page.number }} sur {{ page.paginator.num_pages }}</span></li>
        {% if page.has_next %}
        <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Suivant</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
